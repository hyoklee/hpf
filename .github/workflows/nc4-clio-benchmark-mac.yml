name: NetCDF-4 CLIO Performance Benchmark (Mac)

# The macOS counterpart of nc4-clio-benchmark.yml: same three NetCDF-4
# profiles, same driver script, same change gate -- measured on Apple silicon
# instead of an x86-64 Linux container.
#
#   1. netCDF-4 / HDF5 develop                          (sec2 VFD, native VOL)
#   2. netCDF-4 / HDF5 develop + clio-core dev VFD      (HDF5_DRIVER=clio_vfd)
#   3. netCDF-4 / HDF5 develop + clio-core dev VOL      (HDF5_VOL_CONNECTOR=clio)
#
# Results are appended to `benchmarks_nc4_clio_mac/` on gh-pages -- a separate
# directory from the Linux series on purpose. github-action-benchmark keys its
# history on the benchmark name alone, so publishing both platforms into one
# directory would interleave Linux and macOS numbers into a single line graph.
#
# Two things differ from the Linux workflow and neither is incidental:
#
#   * No container. macOS runners cannot run one, so clio-core's dependency set
#     (thallium/mercury/argobots/cereal/yaml-cpp ...) comes from the conda env
#     that clio-core's own CI/ci-deps.sh builds -- the same path its ci-macos.yml
#     and ci-adapters.yml use.
#   * The VFD adapter is not covered by clio-core's macOS CI (ci-vfd.yml is
#     ubuntu-only), so the driver is given --allow-adapter-build-failure: an
#     adapter that does not compile here drops its own series instead of failing
#     the run and losing the other two.

on:
  schedule:
    # 09:00 UTC. The Linux CLIO benchmark runs at 07:00 and daily_mac.yml at
    # 08:00; keep all three apart so they do not contend for gh-pages.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when no upstream repo changed'
        type: boolean
        default: false
      bench_args:
        description: 'tst_chunks3 args: <deflate> <dim1> <chunk1> <dim2> <chunk2> <dim3> <chunk3>'
        type: string
        # Same modest default as the Linux workflow, and for the same reason:
        # the CLIO VFD's contiguous slab writes are orders of magnitude slower
        # than sec2, so larger dimensions make that series time out and vanish
        # rather than make the comparison more interesting.
        default: '6 64 16 64 16 64 16'

concurrency:
  # Serialize against itself only. The Linux workflow pushes to a different
  # directory of gh-pages, and `git pull --rebase` in the publish step handles
  # the two of them landing close together.
  group: nc4-clio-benchmark-mac
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # Change gate, identical in shape to the Linux workflow but stamped in
  # benchmarks_nc4_clio_mac/. It runs on Linux: it only resolves remote HEADs,
  # and a macOS runner costs 10x per minute for the same `git ls-remote`.
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_run:  ${{ steps.decide.outputs.should_run }}
      hdf5_sha:    ${{ steps.heads.outputs.hdf5_sha }}
      netcdf_sha:  ${{ steps.heads.outputs.netcdf_sha }}
      clio_sha:    ${{ steps.heads.outputs.clio_sha }}
      reason:      ${{ steps.decide.outputs.reason }}
    steps:
      - name: Resolve upstream HEADs
        id: heads
        run: |
          set -euo pipefail
          resolve() {
            local sha
            sha=$(git ls-remote "$1" "refs/heads/$2" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "::error::could not resolve $1 $2" >&2
              exit 1
            fi
            echo "$sha"
          }
          HDF5_SHA=$(resolve https://github.com/HDFGroup/hdf5.git develop)
          NETCDF_SHA=$(resolve https://github.com/Unidata/netcdf-c.git main)
          CLIO_SHA=$(resolve https://github.com/iowarp/clio-core.git dev)
          {
            echo "hdf5_sha=$HDF5_SHA"
            echo "netcdf_sha=$NETCDF_SHA"
            echo "clio_sha=$CLIO_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "hdf5     develop $HDF5_SHA"
          echo "netcdf-c main    $NETCDF_SHA"
          echo "clio-core dev    $CLIO_SHA"

      - name: Checkout gh-pages stamp
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Decide whether to benchmark
        id: decide
        run: |
          set -euo pipefail
          STAMP=gh-pages/benchmarks_nc4_clio_mac/last_run.json
          SHOULD_RUN=true
          REASON="no previous run recorded"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.force }}" = "true" ]; then
            REASON="forced via workflow_dispatch"
          elif [ -f "$STAMP" ]; then
            prev() { python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" "$STAMP" "$1"; }
            PREV_HDF5=$(prev hdf5_sha)
            PREV_NETCDF=$(prev netcdf_sha)
            PREV_CLIO=$(prev clio_sha)
            CHANGED=""
            [ "$PREV_HDF5"   = "${{ steps.heads.outputs.hdf5_sha }}"   ] || CHANGED="$CHANGED hdf5"
            [ "$PREV_NETCDF" = "${{ steps.heads.outputs.netcdf_sha }}" ] || CHANGED="$CHANGED netcdf-c"
            [ "$PREV_CLIO"   = "${{ steps.heads.outputs.clio_sha }}"   ] || CHANGED="$CHANGED clio-core"
            if [ -z "$CHANGED" ]; then
              SHOULD_RUN=false
              REASON="no change in clio-core, hdf5, or netcdf-c since the last run"
            else
              REASON="changed:$CHANGED"
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN ($REASON)"
          echo "### NetCDF-4 CLIO benchmark (macOS): \`should_run=$SHOULD_RUN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Checkout HPF
        uses: actions/checkout@v4

      # gtimeout. The driver falls back to a shell watchdog without it, but
      # coreutils' timeout(1) is the better-tested path and is a 10 s install.
      - name: Install coreutils
        run: brew install coreutils

      - name: Cache HDF5 develop build
        uses: actions/cache@v4
        with:
          path: |
            nc4-clio-work/hdf5-build
            nc4-clio-work/hdf5-install
          key: nc4clio-mac-hdf5-${{ needs.check.outputs.hdf5_sha }}-macos-26

      - name: Cache netCDF-C build
        uses: actions/cache@v4
        with:
          path: |
            nc4-clio-work/netcdf-build
            nc4-clio-work/netcdf-install
          key: nc4clio-mac-netcdf-${{ needs.check.outputs.netcdf_sha }}-${{ needs.check.outputs.hdf5_sha }}-macos-26

      - name: Cache clio-core build
        uses: actions/cache@v4
        with:
          path: nc4-clio-work/clio-build
          key: nc4clio-mac-clio-${{ needs.check.outputs.clio_sha }}-${{ needs.check.outputs.hdf5_sha }}-macos-26

      # Cloned here rather than by the driver because CI/ci-deps.sh lives in
      # this checkout and has to run before anything is configured. The driver
      # is then pointed at it with --clio-src and clones only the other two.
      - name: Clone clio-core
        run: |
          set -euo pipefail
          mkdir -p nc4-clio-work
          if [ ! -d nc4-clio-work/clio-src/.git ]; then
            git clone --depth 1 --branch dev --recurse-submodules \
              https://github.com/iowarp/clio-core.git nc4-clio-work/clio-src
          fi
          git -C nc4-clio-work/clio-src rev-parse HEAD

      # ci-deps.sh installs Miniconda if absent and creates the `iowarp` env
      # holding clio-core's dependency set. It is not cached: the env is several
      # GB, and this job only runs when an upstream repo actually moved.
      - name: Install clio-core dependencies (conda)
        run: |
          set -euo pipefail
          cd nc4-clio-work/clio-src
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps release

      - name: Build and run the three NetCDF-4 variants
        run: |
          # Deliberately no `set -u` yet: conda's own activation hooks are not
          # nounset-clean (activate_cctools_osx-arm64.sh reads $AR before
          # setting it, which aborts the step). It is turned on right after.
          set -eo pipefail
          # The conda env does not survive across steps; re-activate it and
          # publish its prefix so the driver's clio configure can find the
          # dependencies. The driver prepends our own HDF5 to CMAKE_PREFIX_PATH,
          # so the conda HDF5 that comes with this env cannot win -- and the
          # driver's otool ABI gate fails the build if it somehow does.
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif [ -f "$HOME/anaconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/anaconda3/etc/profile.d/conda.sh"
          elif command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          set -u
          # ':'-separated: this is the environment form of the variable. The
          # driver converts it to a ';' CMake list when it folds our own HDF5 in
          # front of it. Pinning ar/ranlib to Xcode's is the driver's job too --
          # CMake does not read CMAKE_AR from the environment.
          export CMAKE_PREFIX_PATH="${CONDA_PREFIX}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export PKG_CONFIG_PATH="${CONDA_PREFIX}/lib/pkgconfig:${CONDA_PREFIX}/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          bash .github/scripts/nc4_clio_bench.sh \
            --clone \
            --clio-src "$GITHUB_WORKSPACE/nc4-clio-work/clio-src" \
            --work-dir "$GITHUB_WORKSPACE/nc4-clio-work" \
            --results-dir "$GITHUB_WORKSPACE/benchmark-results" \
            --hdf5-ref develop \
            --netcdf-ref main \
            --bench-args "${{ inputs.bench_args || '6 64 16 64 16 64 16' }}" \
            --run-timeout 45m \
            --allow-adapter-build-failure \
            --jobs "$(sysctl -n hw.ncpu)"

      - name: Report which variants produced results
        if: always()
        run: |
          # A CLIO variant that crashes, times out, or does not compile on macOS
          # is dropped by the driver so the surviving variants still publish.
          # That must be visible here -- otherwise the dashboard quietly loses a
          # series and nobody notices.
          {
            echo "### Variants (macOS)"
            echo
            echo "| variant | result |"
            echo "| --- | --- |"
            for v in baseline clio_vfd clio_vol; do
              if [ -s "benchmark-results/tst_chunks3_${v}.txt" ]; then
                echo "| \`$v\` | measured |"
              else
                echo "| \`$v\` | :warning: no result (not built, crashed, or timed out) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test -s benchmark-results/tst_chunks3_baseline.txt || {
            echo "::error::the baseline variant produced no result; nothing to compare against"
            exit 1
          }

      - name: Parse results
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Label the results with what the driver actually built, not with the
          # SHAs the check job resolved -- a branch can move in between.
          sha() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]][:8])" \
                    nc4-clio-work/sources.json "$1"; }
          INFO="macOS - hdf5 $(sha hdf5_sha) / netcdf-c $(sha netcdf_sha) / clio-core $(sha clio_sha)"
          echo "$INFO"

          for variant in baseline clio_vfd clio_vol; do
            python3 .github/scripts/parse_nc4_clio_results.py \
              "benchmark-results/tst_chunks3_${variant}.txt" \
              "benchmark-results/nc4_${variant}.json" \
              "$variant" "$INFO"
          done

          python3 .github/scripts/combine_nc4_clio_results.py \
            benchmark-results/nc4_baseline.json \
            benchmark-results/nc4_clio_vfd.json \
            benchmark-results/nc4_clio_vol.json \
            benchmark-results/benchmark_data.json

      - name: Validate existing gh-pages history
        id: history-before
        run: |
          set -euo pipefail
          # github-action-benchmark silently discards history it cannot
          # JSON.parse. Record the current entry count so the post-publish
          # check can prove nothing was wiped.
          git fetch --depth=1 origin gh-pages || true
          if git cat-file -e FETCH_HEAD:benchmarks_nc4_clio_mac/data.js 2>/dev/null; then
            git show FETCH_HEAD:benchmarks_nc4_clio_mac/data.js > /tmp/gh-pages-data-mac.js
            python3 .github/scripts/validate_data_js.py /tmp/gh-pages-data-mac.js \
              --output-name entries
          else
            echo "No benchmarks_nc4_clio_mac/data.js on gh-pages yet"
            echo "entries=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'NetCDF-4 CLIO Performance Benchmarks (macOS)'
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/benchmark_data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks_nc4_clio_mac
          skip-fetch-gh-pages: false
          comment-always: false
          summary-always: true
          save-data-file: true
          comment-on-alert: false
          alert-threshold: 200%
          fail-on-alert: false

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify benchmark history was not truncated
        run: |
          python3 .github/scripts/validate_data_js.py \
            gh-pages/benchmarks_nc4_clio_mac/data.js \
            --min-entries ${{ steps.history-before.outputs.entries }}

      - name: Build comparison plot page
        run: |
          set -euo pipefail
          python3 .github/scripts/create_nc4_clio_plots.py \
            gh-pages/benchmarks_nc4_clio_mac/data.js \
            gh-pages/benchmarks_nc4_clio_mac/plots.html \
            --title "NetCDF-4 CLIO Performance Benchmark (macOS)"

      - name: Write run stamp
        run: |
          set -euo pipefail
          mkdir -p gh-pages/benchmarks_nc4_clio_mac
          # Stamp the SHAs that were actually built (sources.json), so the next
          # run's change gate compares against what was really measured.
          python3 - <<'PY'
          import json, os, datetime
          src = json.load(open("nc4-clio-work/sources.json"))
          src.update(
              run_id=os.environ["GITHUB_RUN_ID"],
              run_number=os.environ["GITHUB_RUN_NUMBER"],
              completed_at=datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
          )
          with open("gh-pages/benchmarks_nc4_clio_mac/last_run.json", "w") as fh:
              json.dump(src, fh, indent=2)
          print(src)
          PY

      - name: Commit plot page and stamp
        run: |
          set -euo pipefail
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add benchmarks_nc4_clio_mac/plots.html benchmarks_nc4_clio_mac/last_run.json
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update NetCDF-4 CLIO macOS benchmark page (hdf5 ${{ needs.check.outputs.hdf5_sha }}, clio-core ${{ needs.check.outputs.clio_sha }})"
            # The github-action-benchmark step above pushed to the same branch;
            # rebase rather than force so its data.js commit is preserved.
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi

      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc4-clio-mac-benchmark-results-${{ github.run_number }}
          path: |
            benchmark-results/
            nc4-clio-work/clio_run.log
          retention-days: 90
          if-no-files-found: warn
