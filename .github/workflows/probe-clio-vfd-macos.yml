name: probe - CLIO VFD on macOS

# EXPERIMENT, not part of the benchmark suite. Delete once it has answered.
#
# The CLIO VFD has no macOS series in benchmarks_nc4_clio_mac/ because
# clio-core never builds the target there: add_subdirectory(vfd) sits inside
# `if(CLIO_CORE_ENABLE_ELF)` in context-transfer-engine/adapter/CMakeLists.txt,
# and that option does pkg_check_modules(libelf REQUIRED libelf), which cannot
# be satisfied on Mach-O.
#
# The gate looks incidental rather than deliberate: the VFD is a plugin HDF5
# dlopen's, not a libc interceptor. It never includes real_api.h and never
# calls dlsym/RTLD_NEXT; it links ctp::interceptor, but that is an INTERFACE
# target which only attaches libelf when ELF is on. Since clio-core e2050b6b
# its remaining dependency is clio_cte_filesystem_client, which is not
# UNIX-gated at all.
#
# Round 1 (run 31141294898) answered the build question: with the VFD moved to
# a UNIX gate it compiles and links on macos-26, producing libclio_vfd.dylib.
#
# Round 2, below, answers the one that actually matters: does it WORK? Same
# in-job CMake change (nothing is pushed to clio-core), then the real benchmark
# driver -- HDF5 develop, netCDF-C main, a live clio_run, and tst_chunks3
# driven through HDF5_DRIVER=clio_vfd. Results are printed, not published:
# this is a probe, not a dashboard run.

on:
  workflow_dispatch:
    inputs:
      clio_ref:
        description: 'clio-core ref to probe'
        type: string
        default: dev
      bench_args:
        description: 'tst_chunks3 args'
        type: string
        default: '6 64 16 64 16 64 16'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout HPF
        uses: actions/checkout@v4

      - name: Install coreutils
        run: brew install coreutils

      - name: Clone clio-core
        run: |
          set -euo pipefail
          mkdir -p nc4-clio-work
          git clone --depth 1 --branch "${{ inputs.clio_ref || 'dev' }}" \
            --recurse-submodules https://github.com/iowarp/clio-core.git \
            nc4-clio-work/clio-src
          git -C nc4-clio-work/clio-src rev-parse HEAD

      - name: Move the VFD off the ELF gate and onto the UNIX gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("nc4-clio-work/clio-src/context-transfer-engine/adapter/CMakeLists.txt")
          s = p.read_text()

          vfd_block = ("    if (CLIO_CTE_ENABLE_VFD)\n"
                       "        add_subdirectory(vfd)\n"
                       "    endif()\n")
          elf_comment = "# Adapters require ELF support (for real_api.h)\n"

          # Fail loudly rather than probing an unmodified tree and reporting a
          # result that says nothing about the change.
          assert s.count(vfd_block) == 1, "VFD block not found as expected"
          assert s.count(elf_comment) == 1, "ELF gate comment not found as expected"

          insert = (
              "# PROBE: the VFD is a dlopen'd HDF5 plugin, not an interceptor --\n"
              "# it never touches real_api.h -- so it does not need the ELF gate.\n"
              "if(UNIX AND CLIO_CTE_ENABLE_VFD)\n"
              "    add_subdirectory(vfd)\n"
              "endif()\n"
              "\n"
          )
          s = s.replace(vfd_block, "")                     # out of the ELF gate
          s = s.replace(elf_comment, insert + elf_comment) # onto a UNIX gate
          p.write_text(s)
          print("gate moved")
          PY
          git -C nc4-clio-work/clio-src diff --stat

      - name: Install clio-core dependencies (conda)
        run: |
          set -eo pipefail
          cd nc4-clio-work/clio-src
          chmod +x CI/ci-deps.sh
          ./CI/ci-deps.sh --only-deps release

      # No --allow-adapter-build-failure on purpose: round 1 established that
      # the VFD builds, so a build failure here is a real regression and should
      # stop the job rather than quietly drop the variant we came to measure.
      - name: Build and run baseline + clio_vfd
        id: bench
        run: |
          set -eo pipefail
          if [ -f "$HOME/miniconda3/etc/profile.d/conda.sh" ]; then
            source "$HOME/miniconda3/etc/profile.d/conda.sh"
          elif command -v conda >/dev/null 2>&1; then
            eval "$(conda shell.bash hook)"
          fi
          conda activate iowarp
          set -u
          export CMAKE_PREFIX_PATH="${CONDA_PREFIX}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          export PKG_CONFIG_PATH="${CONDA_PREFIX}/lib/pkgconfig:${CONDA_PREFIX}/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          bash .github/scripts/nc4_clio_bench.sh \
            --clone \
            --clio-src "$(pwd)/nc4-clio-work/clio-src" \
            --work-dir "$(pwd)/nc4-clio-work" \
            --results-dir "$(pwd)/benchmark-results" \
            --hdf5-ref develop \
            --netcdf-ref main \
            --variants baseline,clio_vfd \
            --bench-args "${{ inputs.bench_args || '6 64 16 64 16 64 16' }}" \
            --run-timeout 20m \
            --jobs "$(sysctl -n hw.ncpu)"

      - name: Verdict
        if: always()
        run: |
          {
            echo "## Does the CLIO VFD run on macOS with the ELF gate moved?"
            echo
            echo "| variant | measured? |"
            echo "| --- | --- |"
            for v in baseline clio_vfd; do
              if [ -s "benchmark-results/tst_chunks3_${v}.txt" ]; then
                echo "| \`$v\` | yes |"
              else
                echo "| \`$v\` | **no** |"
              fi
            done
            echo
            if [ -s benchmark-results/tst_chunks3_clio_vfd.txt ]; then
              echo "### clio_vfd timings"
              echo '```'
              grep -E "^\s+(contiguous|chunked|compressed)" \
                benchmark-results/tst_chunks3_clio_vfd.txt || true
              echo '```'
              echo "### baseline, for comparison"
              echo '```'
              grep -E "^\s+(contiguous|chunked|compressed)" \
                benchmark-results/tst_chunks3_baseline.txt || true
              echo '```'
            else
              echo "**clio_vfd produced no result.** Tail of the runtime log:"
              echo '```'
              tail -30 nc4-clio-work/clio_run.log 2>/dev/null || echo "(no clio_run.log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test -s benchmark-results/tst_chunks3_clio_vfd.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clio-vfd-macos-run-probe
          path: |
            benchmark-results/
            nc4-clio-work/clio_run.log
          if-no-files-found: warn
