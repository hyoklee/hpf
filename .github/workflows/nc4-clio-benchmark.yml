name: NetCDF-4 CLIO Performance Benchmark

# Compares three NetCDF-4 performance profiles, all on the same netCDF-C `main`
# and the same HDF5 `develop` build so that any delta is attributable to the
# CLIO adapter under test and not to a different library build:
#
#   1. netCDF-4 / HDF5 develop                          (sec2 VFD, native VOL)
#   2. netCDF-4 / HDF5 develop + clio-core dev VFD      (HDF5_DRIVER=clio_vfd)
#   3. netCDF-4 / HDF5 develop + clio-core dev VOL      (HDF5_VOL_CONNECTOR=clio)
#
# Results are appended to the `benchmarks_nc4_clio/` directory on gh-pages.

on:
  schedule:
    # Daily at 07:00 UTC -- an hour after daily.yml so the two jobs do not
    # contend for the same gh-pages branch.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when no upstream repo changed'
        type: boolean
        default: false
      bench_args:
        description: 'tst_chunks3 args: <deflate> <dim1> <chunk1> <dim2> <chunk2> <dim3> <chunk3>'
        type: string
        # Deliberately modest. The CLIO VFD's contiguous slab writes are orders
        # of magnitude slower than sec2 (3.5 s vs ~0.1 ms for a 32x32x1 slab
        # loop measured locally), so the dimensions that make the baseline
        # interesting are the ones that make the clio_vfd series time out and
        # disappear. Raise it here for a one-off deep run.
        default: '6 64 16 64 16 64 16'

concurrency:
  # gh-pages is pushed to by this workflow; serialize so two runs cannot race
  # on the benchmarks_nc4_clio/ history.
  group: nc4-clio-benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # Change gate. The benchmark only means something when one of the three
  # upstream sources moved, so resolve their HEADs and compare against the
  # stamp written by the last successful publish. Cache-hit heuristics were
  # rejected here: a cache eviction is not a source change, and it would
  # trigger a full ~1h rebuild for an identical measurement.
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-24.04
    outputs:
      should_run:  ${{ steps.decide.outputs.should_run }}
      hdf5_sha:    ${{ steps.heads.outputs.hdf5_sha }}
      netcdf_sha:  ${{ steps.heads.outputs.netcdf_sha }}
      clio_sha:    ${{ steps.heads.outputs.clio_sha }}
      reason:      ${{ steps.decide.outputs.reason }}
    steps:
      - name: Resolve upstream HEADs
        id: heads
        run: |
          set -euo pipefail
          resolve() {
            local sha
            sha=$(git ls-remote "$1" "refs/heads/$2" | awk '{print $1}')
            if [ -z "$sha" ]; then
              echo "::error::could not resolve $1 $2" >&2
              exit 1
            fi
            echo "$sha"
          }
          HDF5_SHA=$(resolve https://github.com/HDFGroup/hdf5.git develop)
          NETCDF_SHA=$(resolve https://github.com/Unidata/netcdf-c.git main)
          CLIO_SHA=$(resolve https://github.com/iowarp/clio-core.git dev)
          {
            echo "hdf5_sha=$HDF5_SHA"
            echo "netcdf_sha=$NETCDF_SHA"
            echo "clio_sha=$CLIO_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "hdf5     develop $HDF5_SHA"
          echo "netcdf-c main    $NETCDF_SHA"
          echo "clio-core dev    $CLIO_SHA"

      - name: Checkout gh-pages stamp
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Decide whether to benchmark
        id: decide
        run: |
          set -euo pipefail
          STAMP=gh-pages/benchmarks_nc4_clio/last_run.json
          SHOULD_RUN=true
          REASON="no previous run recorded"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.force }}" = "true" ]; then
            REASON="forced via workflow_dispatch"
          elif [ -f "$STAMP" ]; then
            prev() { python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get(sys.argv[2],''))" "$STAMP" "$1"; }
            PREV_HDF5=$(prev hdf5_sha)
            PREV_NETCDF=$(prev netcdf_sha)
            PREV_CLIO=$(prev clio_sha)
            CHANGED=""
            [ "$PREV_HDF5"   = "${{ steps.heads.outputs.hdf5_sha }}"   ] || CHANGED="$CHANGED hdf5"
            [ "$PREV_NETCDF" = "${{ steps.heads.outputs.netcdf_sha }}" ] || CHANGED="$CHANGED netcdf-c"
            [ "$PREV_CLIO"   = "${{ steps.heads.outputs.clio_sha }}"   ] || CHANGED="$CHANGED clio-core"
            if [ -z "$CHANGED" ]; then
              SHOULD_RUN=false
              REASON="no change in clio-core, hdf5, or netcdf-c since the last run"
            else
              REASON="changed:$CHANGED"
            fi
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN ($REASON)"
          echo "### NetCDF-4 CLIO benchmark: \`should_run=$SHOULD_RUN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # Build + measure. Runs inside iowarp/deps-cpu, the image clio-core's own CI
  # uses: clio-core's dependency set (thallium/mercury/argobots/cereal/yaml-cpp
  # and friends) is impractical to install ad hoc on a bare runner.
  # --------------------------------------------------------------------------
  benchmark:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    container:
      image: iowarp/deps-cpu:latest
      # The clio runtime maps GB-scale shared-memory segments; the container
      # default of 64 MB makes `clio_run start` fail to reach readiness.
      options: --shm-size=2g --user 0
    steps:
      # Before checkout on purpose: actions/checkout silently falls back to a
      # REST tarball when the image has no git, and the later `git fetch origin
      # gh-pages` step needs a real repository.
      - name: Install build prerequisites
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq \
            build-essential cmake git pkg-config \
            libcurl4-openssl-dev zlib1g-dev libelf-dev \
            python3 python3-pip procps
          git config --global --add safe.directory '*'

      - name: Checkout HPF
        uses: actions/checkout@v4

      # Each component is cached against the SHAs it was built from, so a run
      # triggered by (say) a clio-core commit reuses the HDF5 and netCDF-C
      # trees instead of rebuilding all three from scratch. The driver script
      # re-runs cmake unconditionally; with the build tree restored that is a
      # no-op, so nothing in the script needs to know about the cache.
      - name: Cache HDF5 develop build
        uses: actions/cache@v4
        with:
          path: |
            nc4-clio-work/hdf5-build
            nc4-clio-work/hdf5-install
          key: nc4clio-hdf5-${{ needs.check.outputs.hdf5_sha }}-depscpu

      - name: Cache netCDF-C build
        uses: actions/cache@v4
        with:
          path: |
            nc4-clio-work/netcdf-build
            nc4-clio-work/netcdf-install
          key: nc4clio-netcdf-${{ needs.check.outputs.netcdf_sha }}-${{ needs.check.outputs.hdf5_sha }}-depscpu

      - name: Cache clio-core build
        uses: actions/cache@v4
        with:
          path: nc4-clio-work/clio-build
          key: nc4clio-clio-${{ needs.check.outputs.clio_sha }}-${{ needs.check.outputs.hdf5_sha }}-depscpu

      # deps-cpu ships its own HDF5 under /usr/local, which stays on the
      # loader path because clio-core's dependencies live there too. The
      # benchmark's own HDF5 prefix is prepended by the driver script, and the
      # ldd gate in that script fails the build if a plugin resolved the wrong
      # libhdf5 anyway -- that is the real protection, not path surgery.
      - name: Build and run the three NetCDF-4 variants
        run: |
          bash .github/scripts/nc4_clio_bench.sh \
            --clone \
            --work-dir "$GITHUB_WORKSPACE/nc4-clio-work" \
            --results-dir "$GITHUB_WORKSPACE/benchmark-results" \
            --hdf5-ref develop \
            --netcdf-ref main \
            --clio-ref dev \
            --bench-args "${{ inputs.bench_args || '6 64 16 64 16 64 16' }}" \
            --run-timeout 45m \
            --jobs "$(nproc)"

      - name: Report which variants produced results
        if: always()
        run: |
          # A CLIO variant that crashes or times out is dropped by the driver so
          # the surviving variants still publish. That must be visible here --
          # otherwise the dashboard quietly loses a series and nobody notices.
          {
            echo "### Variants"
            echo
            echo "| variant | result |"
            echo "| --- | --- |"
            for v in baseline clio_vfd clio_vol; do
              if [ -s "benchmark-results/tst_chunks3_${v}.txt" ]; then
                echo "| \`$v\` | measured |"
              else
                echo "| \`$v\` | :warning: no result (crashed or timed out) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test -s benchmark-results/tst_chunks3_baseline.txt || {
            echo "::error::the baseline variant produced no result; nothing to compare against"
            exit 1
          }

      - name: Parse results
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Label the results with what the driver actually built, not with the
          # SHAs the check job resolved -- a branch can move in between.
          sha() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]][:8])" \
                    nc4-clio-work/sources.json "$1"; }
          INFO="hdf5 $(sha hdf5_sha) / netcdf-c $(sha netcdf_sha) / clio-core $(sha clio_sha)"
          echo "$INFO"

          for variant in baseline clio_vfd clio_vol; do
            python3 .github/scripts/parse_nc4_clio_results.py \
              "benchmark-results/tst_chunks3_${variant}.txt" \
              "benchmark-results/nc4_${variant}.json" \
              "$variant" "$INFO"
          done

          python3 .github/scripts/combine_nc4_clio_results.py \
            benchmark-results/nc4_baseline.json \
            benchmark-results/nc4_clio_vfd.json \
            benchmark-results/nc4_clio_vol.json \
            benchmark-results/benchmark_data.json

      - name: Validate existing gh-pages history
        id: history-before
        run: |
          set -euo pipefail
          # github-action-benchmark silently discards history it cannot
          # JSON.parse. Record the current entry count so the post-publish
          # check can prove nothing was wiped.
          git fetch --depth=1 origin gh-pages || true
          if git cat-file -e FETCH_HEAD:benchmarks_nc4_clio/data.js 2>/dev/null; then
            git show FETCH_HEAD:benchmarks_nc4_clio/data.js > /tmp/gh-pages-data.js
            python3 .github/scripts/validate_data_js.py /tmp/gh-pages-data.js \
              --output-name entries
          else
            echo "No benchmarks_nc4_clio/data.js on gh-pages yet"
            echo "entries=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'NetCDF-4 CLIO Performance Benchmarks'
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark-results/benchmark_data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks_nc4_clio
          skip-fetch-gh-pages: false
          comment-always: false
          summary-always: true
          save-data-file: true
          comment-on-alert: false
          alert-threshold: 200%
          fail-on-alert: false

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify benchmark history was not truncated
        run: |
          python3 .github/scripts/validate_data_js.py \
            gh-pages/benchmarks_nc4_clio/data.js \
            --min-entries ${{ steps.history-before.outputs.entries }}

      - name: Build comparison plot page
        run: |
          set -euo pipefail
          python3 .github/scripts/create_nc4_clio_plots.py \
            gh-pages/benchmarks_nc4_clio/data.js \
            gh-pages/benchmarks_nc4_clio/plots.html

      - name: Write run stamp
        run: |
          set -euo pipefail
          mkdir -p gh-pages/benchmarks_nc4_clio
          # Stamp the SHAs that were actually built (sources.json), so the next
          # run's change gate compares against what was really measured.
          python3 - <<'PY'
          import json, os, datetime
          src = json.load(open("nc4-clio-work/sources.json"))
          src.update(
              run_id=os.environ["GITHUB_RUN_ID"],
              run_number=os.environ["GITHUB_RUN_NUMBER"],
              completed_at=datetime.datetime.now(datetime.timezone.utc)
                              .strftime("%Y-%m-%dT%H:%M:%SZ"),
          )
          with open("gh-pages/benchmarks_nc4_clio/last_run.json", "w") as fh:
              json.dump(src, fh, indent=2)
          print(src)
          PY

      - name: Commit plot page and stamp
        run: |
          set -euo pipefail
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add benchmarks_nc4_clio/plots.html benchmarks_nc4_clio/last_run.json
          if git diff --staged --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update NetCDF-4 CLIO benchmark page (hdf5 ${{ needs.check.outputs.hdf5_sha }}, clio-core ${{ needs.check.outputs.clio_sha }})"
            # The github-action-benchmark step above pushed to the same branch;
            # rebase rather than force so its data.js commit is preserved.
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi

      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nc4-clio-benchmark-results-${{ github.run_number }}
          path: |
            benchmark-results/
            nc4-clio-work/clio_run.log
          retention-days: 90
          if-no-files-found: warn
