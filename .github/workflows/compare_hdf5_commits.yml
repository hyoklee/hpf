name: Compare HDF5 Commits (many_dsets_v1)

# Measures the HPF 1.0.0 many_dsets workload (src/many_dsets_v1.cpp) against
# two HDF5 commits on the same runner. The defaults compare the last HDF5
# develop commit of 2026-10-15 (#6675, internal threading split) with the
# commit before it from 2026-10-13.

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base HDF5 commit/ref'
        default: 'c8f58d6f8bc1b315af38fd15eb10aa4269f071a1'
      head:
        description: 'Head HDF5 commit/ref'
        default: 'ab5df5526c96a03bf1d89cea59603b77a239eac0'
      benchmarks:
        description: 'Space-separated HPF benchmark executables'
        default: 'many_dsets_v1'
      rounds:
        description: 'Alternating rounds per commit'
        default: '3'
      samples:
        description: 'Catch2 samples per round'
        default: '10'
  push:
    branches: [ main ]
    paths:
      - 'src/many_dsets_v1.cpp'
      - '.github/workflows/compare_hdf5_commits.yml'
      - '.github/scripts/compare_hdf5_commits.py'

env:
  BASE: ${{ inputs.base || 'c8f58d6f8bc1b315af38fd15eb10aa4269f071a1' }}
  HEAD: ${{ inputs.head || 'ab5df5526c96a03bf1d89cea59603b77a239eac0' }}
  BENCHMARKS: ${{ inputs.benchmarks || 'many_dsets_v1' }}
  ROUNDS: ${{ inputs.rounds || '3' }}
  SAMPLES: ${{ inputs.samples || '10' }}

jobs:
  compare:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout HPF
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build python3 git

    - name: Resolve HDF5 commits
      id: sha
      run: |
        git clone --filter=blob:none --no-checkout https://github.com/HDFGroup/hdf5.git hdf5-src
        cd hdf5-src
        for side in BASE HEAD; do
          sha=$(git rev-parse "${!side}^{commit}" 2>/dev/null ||
                git rev-parse "origin/${!side}^{commit}")
          echo "$(echo $side | tr A-Z a-z)=$sha" >> $GITHUB_OUTPUT
          git log -1 --format="$side: %H %cI %s" "$sha"
        done

    - name: Cache HDF5 base build
      id: cache-base
      uses: actions/cache@v4
      with:
        path: hdf5-base-install
        key: hdf5-commit-${{ steps.sha.outputs.base }}-ubuntu-24.04

    - name: Cache HDF5 head build
      id: cache-head
      uses: actions/cache@v4
      with:
        path: hdf5-head-install
        key: hdf5-commit-${{ steps.sha.outputs.head }}-ubuntu-24.04

    - name: Build HDF5 commits
      run: |
        build() {
          local side=$1 sha=$2
          git -C hdf5-src worktree add -q "$GITHUB_WORKSPACE/hdf5-$side-src" "$sha"
          cmake -S hdf5-$side-src -B hdf5-$side-build -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/hdf5-$side-install \
                -DHDF5_ENABLE_PARALLEL=OFF \
                -DHDF5_ENABLE_THREADSAFE=OFF \
                -DBUILD_TESTING=OFF \
                -DHDF5_BUILD_EXAMPLES=OFF \
                -DHDF5_BUILD_TOOLS=ON \
                -DHDF5_BUILD_CPP_LIB=OFF \
                -DHDF5_BUILD_FORTRAN=OFF \
                -DHDF5_BUILD_JAVA=OFF \
                -DHDF5_ENABLE_ZLIB_SUPPORT=OFF \
                -DHDF5_ENABLE_SZIP_SUPPORT=OFF
          ninja -C hdf5-$side-build install
        }
        if [[ "${{ steps.cache-base.outputs.cache-hit }}" != "true" ]]; then
          build base ${{ steps.sha.outputs.base }}
        fi
        if [[ "${{ steps.cache-head.outputs.cache-hit }}" != "true" ]]; then
          build head ${{ steps.sha.outputs.head }}
        fi

    - name: Build and test HPF against each commit
      run: |
        for side in base head; do
          cmake -S . -B build-$side -GNinja \
                -DCMAKE_BUILD_TYPE=Release \
                -DHDF5_ROOT=$GITHUB_WORKSPACE/hdf5-$side-install
          ninja -C build-$side
          # The CTest run also verifies the file many_dsets_v1 writes.
          (cd build-$side && \
           LD_LIBRARY_PATH=$GITHUB_WORKSPACE/hdf5-$side-install/lib \
           ctest --output-on-failure -R "many_dsets_v1")
        done

    - name: Run benchmarks (alternating rounds)
      run: |
        mkdir -p results
        for r in $(seq 1 $ROUNDS); do
          for side in base head; do
            for b in $BENCHMARKS; do
              echo "=== round $r: $b with HDF5 $side ==="
              (cd build-$side && \
               LD_LIBRARY_PATH=$GITHUB_WORKSPACE/hdf5-$side-install/lib \
               ./$b --benchmark-samples $SAMPLES) | tee -a results/$side-$r.txt
            done
          done
        done

    - name: Report comparison
      run: |
        base=${{ steps.sha.outputs.base }}
        head=${{ steps.sha.outputs.head }}
        {
          echo "## HPF benchmarks: HDF5 \`${base:0:10}\` vs \`${head:0:10}\`"
          echo
          git -C hdf5-src log -1 --format='- base: [%h](https://github.com/HDFGroup/hdf5/commit/%H) %cs %s' $base
          git -C hdf5-src log -1 --format='- head: [%h](https://github.com/HDFGroup/hdf5/commit/%H) %cs %s' $head
          echo "- $ROUNDS alternating rounds x $SAMPLES Catch2 samples, runner $(nproc) cores"
          echo
          python3 .github/scripts/compare_hdf5_commits.py \
            "base ${base:0:10}" "head ${head:0:10}" results/comparison.json \
            results/base-*.txt -- results/head-*.txt
        } | tee -a $GITHUB_STEP_SUMMARY

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hdf5-commit-comparison-${{ github.run_number }}
        path: results/
        retention-days: 90
