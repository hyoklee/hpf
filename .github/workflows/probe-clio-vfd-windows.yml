name: probe - CLIO VFD (Windows run + Linux build)

# EXPERIMENT, not part of the benchmark suite. Delete once it has answered.
#
# The Windows job answers the question the build probes could not: does the
# ported VFD actually WORK on Windows? Full stack -- HDF5 develop and netCDF-C
# main built from source, a live clio_run, and tst_chunks3 driven through
# HDF5_DRIVER=clio_vfd against the clio-core branch carrying the port. Results
# are printed, not published: a patched clio-core does not belong in the
# dashboard history.
#
# The Linux job stays because the port renames the descriptor API's types
# (off_t/ssize_t -> FsOff/FsSsize) in signatures the POSIX, STDIO and MPI-IO
# interceptors call. It is the regression check, and it has already caught one
# edit that deleted portable code.

on:
  workflow_dispatch:
    inputs:
      clio_ref:
        description: 'clio-core ref to run'
        type: string
        default: vfd-windows
      bench_args:
        description: 'tst_chunks3 args'
        type: string
        default: '6 64 16 64 16 64 16'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  windows-run:
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout HPF
        uses: actions/checkout@v4

      - name: Exclude workspace from Defender (link-flake mitigation)
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe","cl.exe","mspdbsrv.exe","vcpkg.exe","MSBuild.exe" -ErrorAction SilentlyContinue
          if ($env:VCPKG_INSTALLATION_ROOT) {
            Add-MpPreference -ExclusionPath "$env:VCPKG_INSTALLATION_ROOT" -ErrorAction SilentlyContinue
          }

      # zlib for HDF5's deflate filter and netCDF-C; the workload runs at
      # deflate 6, so without it a third of the measurements would vanish.
      - name: Bootstrap vcpkg and install zlib
        shell: pwsh
        run: |
          cd $env:VCPKG_INSTALLATION_ROOT
          git pull
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install zlib:x64-windows

      # netCDF-C generates libsrc/attr.c from .m4 and refuses to configure
      # without m4. Handed to the driver rather than put on PATH: MSYS2's bin
      # carries a link.exe that would shadow MSVC's linker.
      - name: Locate or install m4
        shell: pwsh
        run: |
          $m4 = (Get-Command m4 -ErrorAction SilentlyContinue).Source
          if (-not $m4) {
            $cand = "C:\msys64\usr\bin\m4.exe"
            if (-not (Test-Path $cand) -and (Test-Path "C:\msys64\usr\bin\pacman.exe")) {
              & C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed m4
            }
            if (Test-Path $cand) { $m4 = $cand }
          }
          if (-not $m4) { choco install m4 -y --no-progress | Out-Null; $m4 = (Get-Command m4 -ErrorAction SilentlyContinue).Source }
          if (-not $m4) { throw "m4 not found; netCDF-C cannot generate attr.c without it" }
          $m4 = $m4 -replace '\\','/'
          Write-Host "m4: $m4"
          "NC_M4=$m4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clone the clio-core branch under test
        run: |
          set -euo pipefail
          mkdir -p nc4-clio-work
          git -c core.autocrlf=false clone --depth 1 \
            --branch "${{ inputs.clio_ref || 'vfd-windows' }}" --recurse-submodules \
            https://github.com/iowarp/clio-core.git nc4-clio-work/clio-src
          git -C nc4-clio-work/clio-src log --oneline -1

      # No --allow-adapter-build-failure: the VFD is the thing being measured,
      # so a build failure must stop the job rather than quietly drop it.
      - name: Build the stack and run baseline + clio_vfd
        run: |
          set -euo pipefail
          bash .github/scripts/nc4_clio_bench.sh \
            --clone \
            --clio-src "$(pwd)/nc4-clio-work/clio-src" \
            --work-dir "$(pwd)/nc4-clio-work" \
            --results-dir "$(pwd)/benchmark-results" \
            --hdf5-ref develop \
            --netcdf-ref main \
            --variants baseline,clio_vfd \
            --bench-args "${{ inputs.bench_args || '6 64 16 64 16 64 16' }}" \
            --run-timeout 20m \
            --jobs "${NUMBER_OF_PROCESSORS:-4}"

      - name: Verdict
        if: always()
        run: |
          {
            echo "## Does the CLIO VFD run on Windows?"
            echo
            echo "| variant | measured? |"
            echo "| --- | --- |"
            for v in baseline clio_vfd; do
              if [ -s "benchmark-results/tst_chunks3_${v}.txt" ]; then
                echo "| \`$v\` | yes |"
              else
                echo "| \`$v\` | **no** |"
              fi
            done
            echo
            if [ -s benchmark-results/tst_chunks3_clio_vfd.txt ]; then
              echo "### clio_vfd"
              echo '```'
              grep -E "^\s+(contiguous|chunked|compressed)" benchmark-results/tst_chunks3_clio_vfd.txt || true
              echo '```'
              echo "### baseline"
              echo '```'
              grep -E "^\s+(contiguous|chunked|compressed)" benchmark-results/tst_chunks3_baseline.txt || true
              echo '```'
            else
              echo "**clio_vfd produced no result.** Tail of the runtime log:"
              echo '```'
              tail -40 nc4-clio-work/clio_run.log 2>/dev/null || echo "(no clio_run.log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          test -s benchmark-results/tst_chunks3_clio_vfd.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clio-vfd-windows-run
          path: |
            benchmark-results/
            nc4-clio-work/clio_run.log
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: iowarp/deps-cpu:latest
      options: --user 0
    steps:
      - name: Install build prerequisites
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq build-essential cmake git pkg-config libelf-dev
          git config --global --add safe.directory '*'

      - name: Clone clio-core
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.clio_ref || 'vfd-windows' }}" \
            --recurse-submodules https://github.com/iowarp/clio-core.git clio-src
          git -C clio-src log --oneline -1

      # ELF on, so the POSIX/STDIO interceptors build too: those are the
      # callers whose signatures the type rename touches.
      - name: Configure with every descriptor-API consumer enabled
        run: |
          set -euo pipefail
          cmake -S clio-src -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIO_CORE_ENABLE_RUNTIME=ON \
            -DCLIO_CORE_ENABLE_CTE=ON \
            -DCLIO_CORE_ENABLE_CAE=OFF \
            -DCLIO_CORE_ENABLE_CEE=OFF \
            -DCLIO_CORE_ENABLE_TESTS=OFF \
            -DCLIO_CORE_ENABLE_BENCHMARKS=OFF \
            -DCLIO_CORE_ENABLE_PYTHON=OFF \
            -DCLIO_CORE_ENABLE_ELF=ON \
            -DCLIO_CTE_ENABLE_VFD=ON \
            -DCLIO_CTE_ENABLE_HDF5_VOL=OFF \
            -DCLIO_CTE_ENABLE_POSIX_ADAPTER=ON \
            -DCLIO_CTE_ENABLE_STDIO_ADAPTER=ON \
            -DCLIO_CTE_ENABLE_FUSE_ADAPTER=OFF \
            -DCLIO_CTE_ENABLE_ADIOS2_ADAPTER=OFF \
            -DCLIO_CTE_ENABLE_COMPRESS=OFF \
            -DCLIO_CORE_ENABLE_GRAY_SCOTT=OFF \
            -DCLIO_CTP_LOG_LEVEL=1 > configure.log 2>&1 || { tail -30 configure.log; exit 1; }

      - name: Build the VFD and the POSIX/STDIO interceptors
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)" --target \
            clio_vfd clio_cte_posix clio_cte_stdio 2>&1 | tee build.log

      - name: Verdict
        if: always()
        run: |
          {
            echo "## POSIX side still builds after the type rename?"
            echo
            for t in bin/libclio_vfd.so bin/libclio_cte_posix.so bin/libclio_cte_stdio.so; do
              if [ -f "build/$t" ]; then echo "- \`$t\` built"; else echo "- **\`$t\` MISSING**"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          test -f build/bin/libclio_vfd.so
